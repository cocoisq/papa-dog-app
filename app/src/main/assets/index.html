<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fffaf4">
<title>拍拍小狗！</title>
<style>
:root{--ink:#3d342f;--pink:#ff8fa3;--cream:#fffaf4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body,main,.dog-wrap,#dog{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 15%,#fff 0,#fff8f1 65%,#ffefe6 100%);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
main{width:min(100%,560px);padding:20px 18px;text-align:center;position:relative;overflow:hidden;margin:auto}
h1{font-size:28px;margin:8px 0 4px} .sub{color:#8b7770;margin:0 0 18px;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 auto 16px}
.stat{background:#fff;border:1px solid #f4e6df;border-radius:18px;padding:13px 8px;box-shadow:0 5px 16px #8e625012}
.stat small{display:block;color:#987f76;font-size:12px;margin-bottom:4px}.stat strong{font-size:27px;font-variant-numeric:tabular-nums}
.dog-wrap{position:relative;margin:8px auto 14px;width:min(100%,430px);aspect-ratio:1;background:white;border-radius:28px;box-shadow:0 12px 30px #8e62501c;overflow:hidden;touch-action:manipulation}
#dog{width:88%;height:88%;object-fit:contain;display:block;position:absolute;left:6%;top:6%;transform-origin:50% 82%;}

.dog-wrap:active{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent} .dog-wrap:focus,.dog-wrap:focus-visible,#dog:focus{outline:none}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tap-hint{font-size:14px;color:#8b7770;margin:8px 0 15px}
button{border:0;border-radius:999px;background:#ff8fa3;color:white;font-weight:800;font-size:18px;padding:14px 32px;box-shadow:0 7px 0 #e8788d;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 3px 0 #e8788d}
.history{margin:20px auto 0;background:#fff;border:1px solid #f4e6df;border-radius:18px;padding:14px 16px;text-align:left;max-width:430px}
.history h2{font-size:16px;margin:0 0 8px}.history p{margin:4px 0;color:#786861;font-size:13px}
.reset{margin-top:14px;background:transparent;color:#a18c84;box-shadow:none;font-size:12px;padding:8px}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const key='dogTapGame_v1';
const dateKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let data;
function load(){
 try{data=JSON.parse(localStorage.getItem(key))||{};}catch(e){data={};}
 const today=dateKey();
 if(data.date!==today){data.date=today;data.daily=0;data.fireworks=0;}
 data.daily=Number(data.daily)||0;data.total=Number(data.total)||0;
 data.fireworks=Math.floor(data.daily/100);
 save();render();
}
function save(){localStorage.setItem(key,JSON.stringify(data));}
function render(){
 $('today').textContent=data.daily.toLocaleString();
 $('total').textContent=data.total.toLocaleString();
}
function squish(){
 const dog=$('dog');
 // Q彈的壓扁、回彈、輕晃；每次點擊都會立即重新觸發。
 dog.animate([
  {transform:'scaleX(1) scaleY(1) translateY(0)',offset:0},
  {transform:'scaleX(1.17) scaleY(.76) translateY(9px)',offset:.24},
  {transform:'scaleX(.92) scaleY(1.08) translateY(-4px)',offset:.52},
  {transform:'scaleX(1.06) scaleY(.96) translateY(2px)',offset:.72},
  {transform:'scaleX(.98) scaleY(1.02) translateY(-1px)',offset:.87},
  {transform:'scaleX(1) scaleY(1) translateY(0)',offset:1}
 ],{duration:1050,easing:'cubic-bezier(.22,.85,.3,1)'});
}
function fireworks(){
 const c=$('fx'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),ratio=devicePixelRatio||1;
 c.width=r.width*ratio;c.height=r.height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);
 const colors=['#ff7997','#ffc857','#77c9b8','#9b8cff','#ff9f5a'];
 let particles=[];
 for(let k=0;k<5;k++){const x=r.width*(.16+Math.random()*.68),y=r.height*(.12+Math.random()*.43);
  for(let i=0;i<34;i++){let a=Math.PI*2*i/34,sp=1.5+Math.random()*3.5;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:colors[k%colors.length]});}}
 let frame=0;
 function draw(){ctx.clearRect(0,0,r.width,r.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.life-=.018;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.4,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
 if(++frame<60)requestAnimationFrame(draw);else ctx.clearRect(0,0,r.width,r.height);}
